[package]
name = "handy_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline audio/VAD/transcription core extracted from Handy (cjpais/Handy). No UI framework."

[dependencies]
anyhow = "1.0.95"
cpal = "0.16.0"
rubato = "0.16.2"
hound = "3.5.1"
log = "0.4.25"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
strsim = "0.11"
natural = "0.5"
rustfft = "6.4"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = "1.43.0"
dirs = "6"
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads", features = ["tokio"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
transcribe-rs = { version = "0.3.8", features = ["onnx"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-speech = "0.3"
transcribe-cpp = { version = "0.1.3", features = ["metal"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", features = ["dynamic-backends"] }
windows = "0.61"

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
transcribe-cpp = { version = "0.1.3", features = ["vulkan"] }

[dev-dependencies]
tempfile = "3"
